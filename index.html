<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Happy Birthday 💖</title>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    @import url('https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,300;0,400;0,600;1,400&family=Great+Vibes&family=Poppins:wght@300;400;600&display=swap');

    :root {
      --deep-sea:  #071e33;
      --ocean:     #0d2f4e;
      --mid-sea:   #124a72;
      --surf:      #2a7db5;
      --foam:      #8ec8e8;
      --white-foam:#e0f0fa;
      --gold:      #d4a853;
      --rose:      #c9637a;
      --coral:     #d4786a;
      --white:     #ffffff;
    }

    html { scroll-behavior: smooth; }

    body {
      font-family: 'Poppins', sans-serif;
      background: var(--deep-sea);
      color: var(--white);
      overflow-x: hidden;
    }

    /* ===== CANVAS OVERLAYS ===== */
    #confetti-canvas, #particle-canvas {
      position: fixed; inset: 0;
      pointer-events: none; z-index: 2;
    }
    #confetti-canvas { z-index: 3; }

    /* ===== LOADER ===== */
    #loader {
      position: fixed; inset: 0; z-index: 9999;
      background: radial-gradient(ellipse at center, var(--ocean) 0%, var(--deep-sea) 100%);
      display: flex; flex-direction: column;
      align-items: center; justify-content: center;
      transition: opacity 1.2s ease, visibility 1.2s ease;
    }
    #loader.hidden { opacity: 0; visibility: hidden; pointer-events: none; }

    .loader-heart {
      width: 52px; height: 52px;
      position: relative;
      animation: heartBeat 1.3s ease-in-out infinite;
    }
    .loader-heart::before, .loader-heart::after {
      content: ''; position: absolute; top: 0;
      width: 52px; height: 52px;
      border-radius: 50% 50% 0 0;
      background: var(--rose);
    }
    .loader-heart::before { left: 50%; transform: rotate(-45deg); transform-origin: 0 100%; }
    .loader-heart::after  { left: 0;    transform: rotate(45deg);  transform-origin: 100% 100%; }

    @keyframes heartBeat {
      0%,100% { transform: scale(1); }
      30%     { transform: scale(1.25); }
      60%     { transform: scale(.9); }
    }

    .loader-text {
      margin-top: 28px;
      font-family: 'Great Vibes', cursive;
      font-size: 2rem; color: var(--gold);
      animation: fadeUp 1.8s ease forwards;
    }
    .loader-sub {
      margin-top: 8px; font-size: .8rem;
      color: rgba(255,255,255,.4);
      letter-spacing: 4px; text-transform: uppercase;
      animation: fadeUp 1.8s .4s ease forwards; opacity: 0;
    }
    @keyframes fadeUp {
      from { opacity: 0; transform: translateY(12px); }
      to   { opacity: 1; transform: translateY(0); }
    }

    /* ===== MAIN LAYOUT ===== */
    #main-page {
      display: none;
      min-height: 100vh;
      flex-direction: column;
    }
    #main-page.visible { display: flex; }

    /* ===== HERO / SURPRISE SCREEN ===== */
    #hero {
      min-height: 100vh;
      display: flex; flex-direction: column;
      align-items: center; justify-content: center;
      text-align: center;
      position: relative;
      overflow: hidden;
      background:
        radial-gradient(ellipse at 20% 80%, rgba(18,74,114,.5) 0%, transparent 55%),
        radial-gradient(ellipse at 80% 20%, rgba(42,125,181,.3) 0%, transparent 50%),
        radial-gradient(ellipse at 50% 100%, rgba(142,200,232,.12) 0%, transparent 40%),
        linear-gradient(180deg, #020d18 0%, var(--deep-sea) 35%, var(--ocean) 70%, var(--mid-sea) 100%);
    }

    #hero::before {
      content: '';
      position: absolute; inset: 0;
      background: radial-gradient(ellipse at 35% 45%, rgba(142,200,232,.07) 0%, transparent 40%);
      animation: caustics 9s ease-in-out infinite alternate;
      pointer-events: none;
    }
    @keyframes caustics {
      0%   { opacity: .5; transform: scale(1); }
      100% { opacity: 1;  transform: scale(1.08); }
    }

    /* ===== PRE-REVEAL STATE (button visible) ===== */
    #pre-reveal {
      position: relative; z-index: 10;
      display: flex; flex-direction: column;
      align-items: center;
      animation: fadeUp 1s .5s ease both;
    }

    .hero-badge {
      display: inline-block;
      padding: 6px 20px;
      border: 1px solid rgba(142,200,232,.25);
      border-radius: 50px;
      font-size: .75rem; letter-spacing: 4px;
      text-transform: uppercase; color: var(--foam);
      margin-bottom: 20px;
    }

    .hero-pre {
      font-family: 'Cormorant Garamond', serif;
      font-size: clamp(1rem, 2.5vw, 1.5rem);
      font-weight: 300; font-style: italic;
      color: var(--foam); letter-spacing: 2px;
    }

    .hero-name {
      font-family: 'Great Vibes', cursive;
      font-size: clamp(3.5rem, 11vw, 8rem);
      color: var(--white);
      text-shadow: 0 0 40px rgba(142,200,232,.35), 0 4px 20px rgba(0,0,0,.4);
      line-height: 1; margin: 10px 0 14px;
    }

    .hero-date {
      display: flex; align-items: center; gap: 14px;
      margin-bottom: 32px;
    }
    .hero-date .line {
      width: 50px; height: 1px;
      background: linear-gradient(90deg, transparent, var(--surf), transparent);
    }
    .hero-date span {
      font-family: 'Cormorant Garamond', serif;
      font-size: clamp(.9rem, 2vw, 1.2rem);
      letter-spacing: 5px; color: var(--gold);
    }

    #surpriseBtn {
      padding: 15px 50px;
      font-size: .95rem;
      font-family: 'Poppins', sans-serif;
      font-weight: 600; letter-spacing: 2px;
      text-transform: uppercase;
      background: linear-gradient(135deg, var(--rose), var(--coral));
      color: #fff; border: none;
      border-radius: 50px; cursor: pointer;
      box-shadow: 0 0 35px rgba(201,99,122,.35), 0 6px 24px rgba(0,0,0,.4);
      transition: transform .3s, box-shadow .3s;
      position: relative; overflow: hidden;
    }
    #surpriseBtn::before {
      content: '';
      position: absolute; inset: 0;
      background: linear-gradient(135deg, transparent 30%, rgba(255,255,255,.15) 50%, transparent 70%);
      transform: translateX(-100%);
      transition: transform .5s;
    }
    #surpriseBtn:hover { transform: scale(1.06); box-shadow: 0 0 60px rgba(201,99,122,.55); }
    #surpriseBtn:hover::before { transform: translateX(100%); }

    /* ===== POST-REVEAL (hidden until button clicked) ===== */
    #post-reveal {
      display: none;
      width: 100%;
    }
    #post-reveal.visible { display: block; }

    /* Scroll hint */
    .scroll-hint {
      margin-top: 40px;
      display: flex; flex-direction: column; align-items: center; gap: 6px;
      color: rgba(255,255,255,.3);
      font-size: .65rem; letter-spacing: 3px; text-transform: uppercase;
    }
    .scroll-hint .arrow {
      width: 18px; height: 18px;
      border-right: 2px solid rgba(142,200,232,.35);
      border-bottom: 2px solid rgba(142,200,232,.35);
      transform: rotate(45deg);
      animation: scrollBounce 2s ease-in-out infinite;
    }
    @keyframes scrollBounce {
      0%,100% { transform: rotate(45deg) translateY(0); opacity: .3; }
      50%     { transform: rotate(45deg) translateY(7px); opacity: 1; }
    }

    /* ===== BLOOM PHOTOS SECTION ===== */
    .bloom-section {
      padding: 80px 0 60px;
      text-align: center;
    }

    .section-title {
      font-family: 'Great Vibes', cursive;
      font-size: clamp(2rem, 5vw, 3.2rem);
      color: var(--gold);
      text-shadow: 0 0 20px rgba(212,168,83,.35);
      margin-bottom: 8px;
    }
    .section-sub {
      font-family: 'Cormorant Garamond', serif;
      font-size: 1rem;
      color: rgba(255,255,255,.5);
      font-style: italic;
      margin-bottom: 40px;
    }

    /* Bloom container — photos appear here */
    #bloom-area {
      position: relative;
      display: flex; flex-direction: column;
      align-items: center; gap: 0;
    }

    /* Single bloom item */
    .bloom-item {
      position: relative;
      margin-bottom: 6px;
      opacity: 0;
      transform: scale(.3) translateY(40px);
      transition: opacity 1s ease, transform 1s cubic-bezier(.34,1.56,.64,1);
    }
    .bloom-item.reveal {
      opacity: 1;
      transform: scale(1) translateY(0);
    }

    /* Petal burst container */
    .petal-wrap {
      position: absolute; inset: 0;
      pointer-events: none; overflow: hidden;
    }
    .petal {
      position: absolute;
      border-radius: 50% 0 50% 50%;
      opacity: 0;
      pointer-events: none;
    }

    .bloom-photo {
      position: relative;
      display: inline-block;
      border-radius: 16px;
      overflow: hidden;
      box-shadow: 0 20px 60px rgba(0,0,0,.5), 0 0 30px rgba(42,125,181,.2);
      border: 1px solid rgba(142,200,232,.12);
      max-width: min(440px, 92vw);
    }
    .bloom-photo img {
      display: block;
      width: 100%; height: auto;
      max-height: 480px;
      object-fit: cover;
      border-radius: 16px;
    }
    .bloom-caption {
      position: absolute; bottom: 0; left: 0; right: 0;
      padding: 36px 20px 16px;
      background: linear-gradient(transparent, rgba(0,0,0,.8));
      text-align: center;
    }
    .bloom-caption .cap-num {
      font-size: .65rem; letter-spacing: 4px;
      color: var(--surf); text-transform: uppercase;
    }
    .bloom-caption .cap-text {
      font-family: 'Cormorant Garamond', serif;
      font-size: 1.05rem; color: var(--white);
      font-style: italic; margin-top: 4px;
    }

    /* Petal keyframe injected by JS */
    @keyframes petalOut {
      0%   { opacity: 0; transform: rotate(0deg) scale(0) translate(0,0); }
      35%  { opacity: 1; transform: rotate(140deg) scale(1.1) translate(6px,-10px); }
      100% { opacity: 0; transform: rotate(320deg) scale(.3) translate(-30px,-60px); }
    }

    /* ===== VIDEO SECTION ===== */
    .video-section {
      padding: 50px 0 60px;
      text-align: center;
    }
    .video-wrap {
      max-width: min(560px, 92vw);
      margin: 0 auto;
      border-radius: 18px;
      overflow: hidden;
      box-shadow: 0 16px 50px rgba(0,0,0,.5), 0 0 30px rgba(42,125,181,.2);
      border: 1px solid rgba(142,200,232,.1);
      opacity: 0;
      transform: translateY(30px);
      transition: opacity .8s ease, transform .8s ease;
    }
    .video-wrap.reveal { opacity: 1; transform: translateY(0); }
    .video-wrap video {
      width: 100%; height: auto;
      display: block;
    }
    .video-label {
      padding: 14px 18px;
      background: rgba(7,30,51,.9);
      text-align: left;
    }
    .video-label span {
      font-family: 'Cormorant Garamond', serif;
      font-size: .95rem; color: rgba(255,255,255,.7);
      font-style: italic;
    }

    /* ===== WORDS SECTION ===== */
    .words-section {
      padding: 50px 0 80px;
    }
    .words-wrap {
      max-width: 680px;
      margin: 0 auto;
      display: flex; flex-direction: column; gap: 16px;
      padding: 0 20px;
    }
    .word-card {
      background: rgba(255,255,255,.03);
      border: 1px solid rgba(142,200,232,.08);
      border-radius: 16px;
      padding: 22px 26px;
      backdrop-filter: blur(8px);
      opacity: 0;
      transform: translateY(20px);
      transition: opacity .6s ease, transform .6s ease, background .3s, border-color .3s;
    }
    .word-card.reveal { opacity: 1; transform: translateY(0); }
    .word-card:hover {
      background: rgba(201,99,122,.05);
      border-color: rgba(201,99,122,.2);
    }
    .word-card .wc-icon { font-size: 1.2rem; display: block; margin-bottom: 8px; }
    .word-card p {
      font-family: 'Cormorant Garamond', serif;
      font-size: 1.05rem; line-height: 1.85;
      color: rgba(255,255,255,.82);
      font-style: italic;
    }

    /* ===== FINAL SECTION ===== */
    .final-section {
      padding: 60px 0 80px;
      text-align: center;
      background: linear-gradient(180deg, transparent, rgba(7,30,51,.5));
    }
    .final-name {
      font-family: 'Great Vibes', cursive;
      font-size: clamp(3rem, 8vw, 6rem);
      color: var(--white);
      text-shadow: 0 0 40px rgba(201,99,122,.45), 0 0 80px rgba(201,99,122,.2);
      animation: glow 3s ease-in-out infinite alternate;
    }
    @keyframes glow {
      from { text-shadow: 0 0 40px rgba(201,99,122,.45), 0 0 80px rgba(201,99,122,.2); }
      to   { text-shadow: 0 0 55px rgba(201,99,122,.7), 0 0 110px rgba(201,99,122,.4); }
    }
    .final-date {
      font-family: 'Poppins', sans-serif;
      font-size: .85rem; letter-spacing: 6px;
      color: var(--gold); margin-top: 8px;
    }
    .final-hearts { margin-top: 20px; font-size: 1.6rem; animation: heartsFloat 2.5s ease-in-out infinite alternate; }
    @keyframes heartsFloat {
      from { transform: translateY(0) rotate(-2deg); }
      to   { transform: translateY(-8px) rotate(2deg); }
    }

    /* ===== FOOTER ===== */
    footer {
      padding: 22px;
      text-align: center;
      background: #010810;
      border-top: 1px solid rgba(142,200,232,.05);
    }
    footer p { color: rgba(255,255,255,.22); font-size: .72rem; }

    /* ===== RESPONSIVE ===== */
    @media(max-width: 600px) {
      .bloom-photo { max-width: 96vw; }
      .bloom-caption { padding: 28px 14px 12px; }
    }
  </style>
</head>
<body>

<!-- LOADER -->
<div id="loader">
  <div class="loader-heart"></div>
  <div class="loader-text">Memuat...</div>
  <div class="loader-sub">Tunggu sebentar</div>
</div>

<canvas id="confetti-canvas"></canvas>
<canvas id="particle-canvas"></canvas>

<!-- MAIN PAGE -->
<div id="main-page">

  <!-- HERO -->
  <section id="hero">

    <!-- Pre-reveal (button) -->
    <div id="pre-reveal">
      <div class="hero-badge">Surprise</div>
      <div class="hero-pre">Selamat Ulang Tahun</div>
      <div class="hero-name">Sayangku</div>
      <div class="hero-date">
        <div class="line" style="width:40px;height:1px;background:linear-gradient(90deg,transparent,var(--surf))"></div>
        <span>3 Juni 2026</span>
        <div class="line" style="width:40px;height:1px;background:linear-gradient(90deg,var(--surf),transparent)"></div>
      </div>
      <button id="surpriseBtn" onclick="triggerSurprise()">Buka Kejutan</button>
      <div class="scroll-hint">
        <div class="arrow"></div>
        <span>Scroll ke bawah</span>
      </div>
    </div>

    <!-- Post-reveal (hidden until clicked) -->
    <div id="post-reveal">

      <!-- BLOOM PHOTOS -->
      <div class="bloom-section">
        <div class="section-title">Kenangan Kita 💕</div>
        <div class="section-sub">Sentuh foto untuk melihat lebih dekat</div>

        <div id="bloom-area">
          <!-- Bloom items injected by JS -->
        </div>
      </div>

      <!-- VIDEO -->
      <div class="video-section">
        <div class="section-title" style="font-size:2.2rem;margin-bottom:24px">Video Kenangan 🎬</div>
        <div class="video-wrap" id="videoWrap">
          <video src="assets/media/video1.mp4" controls preload="metadata" playsinline></video>
          <div class="video-label"><span>Untukmu, dengan sepenuh hati 💖</span></div>
        </div>
      </div>

      <!-- WORDS -->
      <div class="words-section">
        <div class="section-title" style="margin-bottom:28px">Untukmu 🥳</div>
        <div class="words-wrap" id="wordsWrap">
          <!-- Word cards injected by JS -->
        </div>
      </div>

      <!-- FINAL -->
      <div class="final-section">
        <div class="final-name">Sayangku</div>
        <div class="final-date">✦ 3 JUNI 2026 ✦</div>
        <div class="final-hearts">💖 💝 💕 💗</div>
      </div>

    </div><!-- /post-reveal -->

  </section>

  <footer>
    <p>Dibuat dengan cinta 💖</p>
  </footer>

</div>

<script>
  /* ===== DATA ===== */
  const photos = [
    { src: 'assets/media/foto1.jpeg', caption: 'Kenangan pertama kita' },
    { src: 'assets/media/foto2.jpeg', caption: 'Hari yang tak terlupakan' },
    { src: 'assets/media/foto3.jpeg', caption: 'Tawa yang selalu kunanti' },
    { src: 'assets/media/foto4.jpeg', caption: 'Bersamamu, selalu' },
    { src: 'assets/media/foto5.jpeg', caption: 'Momen paling berarti' },
  ];

  const words = [
    { icon: '🎂', text: 'Selamat ulang tahun, sayang. Semoga setiap hari membawa ketenangan dan kebahagiaan yang pantas sekali miliki.' },
    { icon: '🌙', text: 'Semoga semua yang dianganmu pelan-pelan menjadi nyata. Aku bangga dengan siapa kamu hari ini.' },
    { icon: '☀️', text: 'Terima kasih sudah berjalan di sisiku. Setiap momen bersamamu adalah sesuatu yang akan selalu kusyukuri.' },
    { icon: '🌿', text: 'Semoga sehat selalu, hati tetap tenang, dan senyummu tidak pernah pudar. Kamu bagian terindah dalam hidupku.' },
    { icon: '💫', text: 'Happy birthday. Aku sayang kamu — lebih sederhana dari yang bisa diungkapkan kata-kata, lebih dalam dari yang terlihat.' },
  ];

  /* ===== AUDIO ===== */
  const bgAudio = new Audio('assets/media/lagu1.mp3');
  bgAudio.loop = true;

  /* ===== LOADER ===== */
  window.addEventListener('load', () => {
    setTimeout(() => document.getElementById('loader').classList.add('hidden'), 1800);
  });

  /* ===== TRIGGER SURPRISE ===== */
  function triggerSurprise() {
    // Audio
    bgAudio.play().catch(() => {});

    // Animations
    startConfetti();
    startParticles();

    // Show post-reveal content
    const post = document.getElementById('post-reveal');
    post.classList.add('visible');

    // Hide pre-reveal elements (button area scrolls up)
    const pre = document.getElementById('pre-reveal');
    pre.style.transition = 'opacity .8s ease, transform .8s ease';
    pre.style.opacity = '0';
    pre.style.transform = 'translateY(-30px)';
    setTimeout(() => { pre.style.display = 'none'; }, 800);

    // Scroll to bloom area smoothly
    setTimeout(() => {
      document.getElementById('bloom-area').scrollIntoView({ behavior: 'smooth', block: 'start' });
    }, 400);

    // Build and bloom photos one by one
    buildBloomPhotos();

    // Build words
    buildWords();
  }

  /* ===== BUILD BLOOM PHOTOS ===== */
  function buildBloomPhotos() {
    const area = document.getElementById('bloom-area');
    area.innerHTML = '';

    photos.forEach((p, i) => {
      // Create bloom item wrapper
      const item = document.createElement('div');
      item.className = 'bloom-item';
      item.id = 'bloom-' + i;

      // Petal burst container
      const petalWrap = document.createElement('div');
      petalWrap.className = 'petal-wrap';
      petalWrap.id = 'petals-' + i;

      // Photo container
      const photo = document.createElement('div');
      photo.className = 'bloom-photo';

      const img = document.createElement('img');
      img.src = p.src;
      img.alt = p.caption;
      img.loading = 'lazy';

      const caption = document.createElement('div');
      caption.className = 'bloom-caption';
      caption.innerHTML = `
        <div class="cap-num">Kenangan ${i + 1}</div>
        <div class="cap-text">${p.caption}</div>
      `;

      photo.appendChild(img);
      photo.appendChild(caption);

      // Click to fullscreen
      photo.addEventListener('click', () => openFullscreen(i));

      item.appendChild(petalWrap);
      item.appendChild(photo);
      area.appendChild(item);

      // Inject petal keyframes once
      if (!document.getElementById('petal-style')) {
        const style = document.createElement('style');
        style.id = 'petal-style';
        style.textContent = `
          @keyframes petalOut {
            0%   { opacity:0; transform:rotate(0deg) scale(0) translate(0,0); }
            35%  { opacity:1; transform:rotate(140deg) scale(1.1) translate(6px,-10px); }
            100% { opacity:0; transform:rotate(320deg) scale(.3) translate(-30px,-60px); }
          }
        `;
        document.head.appendChild(style);
      }
    });

    // Stagger bloom reveal
    photos.forEach((_, i) => {
      setTimeout(() => {
        const item = document.getElementById('bloom-' + i);
        item.classList.add('reveal');
        spawnPetals('petals-' + i);
      }, 600 + i * 700);
    });
  }

  /* ===== SPAWN PETALS ===== */
  function spawnPetals(containerId) {
    const container = document.getElementById(containerId);
    if (!container) return;
    container.innerHTML = '';
    const colors = ['#c9637a','#d4786a','#e88a7a','#d4826a','#c9706e'];
    const count = 16;
    for (let i = 0; i < count; i++) {
      const p = document.createElement('div');
      p.className = 'petal';
      const size = 16 + Math.random() * 28;
      const angle = (i / count) * 360;
      const dist  = 50 + Math.random() * 65;
      const cx = 50 + Math.cos(angle * Math.PI / 180) * dist;
      const cy = 50 + Math.sin(angle * Math.PI / 180) * dist;
      const color = colors[i % colors.length];
      p.style.cssText = `
        width:${size}px; height:${size}px;
        left:${cx}%; top:${cy}%;
        background:${color};
        box-shadow:0 0 10px ${color}88;
        transform-origin:center;
        animation:petalOut ${.45 + Math.random() * .35}s ${i * 28}ms ease forwards;
      `;
      container.appendChild(p);
    }
    // Clean up petals after animation
    setTimeout(() => { container.innerHTML = ''; }, 1800);
  }

  /* ===== FULLSCREEN PHOTO VIEWER ===== */
  let fsIdx = 0;

  function openFullscreen(index) {
    fsIdx = index;
    const modal = document.createElement('div');
    modal.id = 'fullscreenModal';
    modal.style.cssText = `
      position:fixed; inset:0; z-index:10000;
      background:rgba(2,13,24,.97);
      display:flex; align-items:center; justify-content:center;
      flex-direction:column; cursor:pointer;
    `;

    const img = document.createElement('img');
    img.src = photos[fsIdx].src;
    img.style.cssText = `
      max-width:90vw; max-height:80vh;
      border-radius:16px;
      box-shadow:0 30px 80px rgba(0,0,0,.6);
      animation:fadeZoom .4s ease;
    `;

    const cap = document.createElement('div');
    cap.style.cssText = `
      margin-top:20px; text-align:center;
      font-family:'Cormorant Garamond',serif;
      font-size:1.1rem; font-style:italic; color:rgba(255,255,255,.7);
    `;
    cap.textContent = photos[fsIdx].caption;

    const navHtml = `
      <div style="position:fixed; top:50%; left:20px; transform:translateY(-50%);
           width:44px; height:44px; background:rgba(255,255,255,.08);
           border:1px solid rgba(142,200,232,.18); border-radius:50%;
           display:flex; align-items:center; justify-content:center;
           font-size:1.3rem; color:#fff; cursor:pointer; backdrop-filter:blur(8px);"
           onclick="event.stopPropagation(); fsPrev()">&#10094;</div>
      <div style="position:fixed; top:50%; right:20px; transform:translateY(-50%);
           width:44px; height:44px; background:rgba(255,255,255,.08);
           border:1px solid rgba(142,200,232,.18); border-radius:50%;
           display:flex; align-items:center; justify-content:center;
           font-size:1.3rem; color:#fff; cursor:pointer; backdrop-filter:blur(8px);"
           onclick="event.stopPropagation(); fsNext()">&#10095;</div>
    `;

    modal.innerHTML = navHtml;
    modal.appendChild(img);
    modal.appendChild(cap);

    // Counter
    const counter = document.createElement('div');
    counter.style.cssText = 'margin-top:12px; font-size:.75rem; color:rgba(255,255,255,.4); letter-spacing:3px;';
    counter.textContent = `${fsIdx + 1} / ${photos.length}`;
    modal.appendChild(counter);

    modal.addEventListener('click', () => modal.remove());
    document.body.appendChild(modal);

    // Inject zoom animation
    if (!document.getElementById('fz-style')) {
      const s = document.createElement('style');
      s.id = 'fz-style';
      s.textContent = '@keyframes fadeZoom { from{opacity:0;transform:scale(.6)} to{opacity:1;transform:scale(1)} }';
      document.head.appendChild(s);
    }

    // Keyboard
    const keyHandler = e => {
      if (e.key === 'ArrowLeft')  { fsPrev(); }
      if (e.key === 'ArrowRight') { fsNext(); }
      if (e.key === 'Escape')     { modal.remove(); }
    };
    modal._keyHandler = keyHandler;
    document.addEventListener('keydown', keyHandler);
  }

  function fsUpdate(modal) {
    const img = modal.querySelector('img');
    const cap = modal.querySelector('div[style*="margin-top:20px"]');
    const counter = modal.querySelector('div:last-of-type');
    img.src = photos[fsIdx].src;
    cap.textContent = photos[fsIdx].caption;
    counter.textContent = `${fsIdx + 1} / ${photos.length}`;
    img.style.animation = 'none';
    img.offsetHeight; // reflow
    img.style.animation = 'fadeZoom .3s ease';
  }

  function fsPrev() {
    const modal = document.getElementById('fullscreenModal');
    if (!modal) return;
    fsIdx = (fsIdx - 1 + photos.length) % photos.length;
    fsUpdate(modal);
  }
  function fsNext() {
    const modal = document.getElementById('fullscreenModal');
    if (!modal) return;
    fsIdx = (fsIdx + 1) % photos.length;
    fsUpdate(modal);
  }

  /* ===== BUILD WORDS ===== */
  function buildWords() {
    const wrap = document.getElementById('wordsWrap');
    if (wrap.children.length) return;
    words.forEach((w, i) => {
      const card = document.createElement('div');
      card.className = 'word-card';
      card.innerHTML = `
        <span class="wc-icon">${w.icon}</span>
        <p>${w.text}</p>
      `;
      wrap.appendChild(card);

      // Stagger reveal with delay after photos done
      setTimeout(() => {
        card.classList.add('reveal');
      }, 3800 + i * 350);
    });

    // Reveal video wrap
    setTimeout(() => {
      document.getElementById('videoWrap').classList.add('reveal');
    }, 3500);
  }

  /* ===== CONFETTI ===== */
  function startConfetti() {
    const canvas = document.getElementById('confetti-canvas');
    const ctx = canvas.getContext('2d');
    canvas.width  = window.innerWidth;
    canvas.height = window.innerHeight;
    window.addEventListener('resize', () => { canvas.width = innerWidth; canvas.height = innerHeight; });

    const colors = ['#c9637a','#d4a853','#8ec8e8','#d4786a','#ffffff','#e88a7a'];
    const pieces = Array.from({ length: 220 }, () => ({
      x: Math.random() * canvas.width,
      y: Math.random() * canvas.height - canvas.height,
      w: Math.random() * 9 + 4,
      h: Math.random() * 4 + 2,
      color: colors[Math.floor(Math.random() * colors.length)],
      speed: Math.random() * 2.5 + 1.5,
      drift: (Math.random() - .5) * 1.8,
      rot: Math.random() * Math.PI * 2,
      rotSpeed: (Math.random() - .5) * .1,
    }));

    (function draw() {
      ctx.clearRect(0, 0, canvas.width, canvas.height);
      pieces.forEach(p => {
        ctx.save();
        ctx.translate(p.x, p.y);
        ctx.rotate(p.rot);
        ctx.fillStyle = p.color;
        ctx.fillRect(-p.w / 2, -p.h / 2, p.w, p.h);
        ctx.restore();
        p.y += p.speed;
        p.x += p.drift;
        p.rot += p.rotSpeed;
        if (p.y > canvas.height + 15) p.y = -15;
      });
      requestAnimationFrame(draw);
    })();
  }

  /* ===== PARTICLES ===== */
  function startParticles() {
    const canvas = document.getElementById('particle-canvas');
    const ctx = canvas.getContext('2d');
    canvas.width  = window.innerWidth;
    canvas.height = window.innerHeight;
    window.addEventListener('resize', () => { canvas.width = innerWidth; canvas.height = innerHeight; });

    const pts = Array.from({ length: 90 }, () => ({
      x: Math.random() * canvas.width,
      y: Math.random() * canvas.height,
      r: Math.random() * 2 + .5,
      alpha: Math.random() * .4 + .15,
      speed: Math.random() * .5 + .1,
    }));

    (function draw() {
      ctx.clearRect(0, 0, canvas.width, canvas.height);
      pts.forEach(p => {
        ctx.beginPath();
        ctx.arc(p.x, p.y, p.r, 0, Math.PI * 2);
        ctx.fillStyle = `rgba(142,200,232,${p.alpha})`;
        ctx.shadowBlur = 10;
        ctx.shadowColor = '#8ec8e8';
        ctx.fill();
        p.y -= p.speed;
        if (p.y < -8) { p.y = canvas.height + 8; p.x = Math.random() * canvas.width; }
      });
      requestAnimationFrame(draw);
    })();
  }

  /* ===== INIT ===== */
  // Show main page after loader
  const loaderObs = new MutationObserver(() => {
    if (document.getElementById('loader').classList.contains('hidden')) {
      document.getElementById('main-page').classList.add('visible');
      loaderObs.disconnect();
    }
  });
  loaderObs.observe(document.getElementById('loader'), { attributes: true, attributeFilter: ['class'] });
</script>
</body>
